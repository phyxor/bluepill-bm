site_name: Blue Pill Bare-Metal
copyright: Copyright &copy; 2026 Phyxor Microsystems
docs_dir: docs
repo_url: https://github.com/ppalazon/bluepill-bm

extra:
  generator: true
  homepage: https://www.phyxor.com

nav:
  - Home: index.md
  - Board:
    - Info: board/info.md
  - System:
      - Memory Map: system/memory-map.md
      - Clock Tree: system/clocks.md
      - Reset: system/reset.md
      - Power: system/power.md
      - Linker and startup: system/linker-startup.md
      - Interrupts: system/interrupts.md
  - Peripherals:
      - GPIO: peripherals/gpio.md
      - SysTick: peripherals/systick.md
      - ADC: peripherals/adc.md
      - Timers: peripherals/timers.md
      - USART: peripherals/usart.md
  - Dev models:
      - C development models: dev-models/abstraction-layers.md
      - Direct-register C: dev-models/direct-registers.md
      - CMSIS: dev-models/cmsis.md
  - Applications:
      - Bare blink: apps/bare-blink.md
  - Environment:
      - Development: environment/development.md
      - Build: environment/build.md
      - Flash, Debug & OpenOCD: environment/flash-debug.md
      - Documentation: environment/documentation.md
  - Reference:
      - Acronyms: reference/acronyms.md
      - STM32F103x8 Datasheet: refs/stm32f103x8-datasheet.pdf
      - STM32F103x8 Reference Manual: refs/stm32f103x8-reference.pdf
      - ARM Cortex-M3 User Guide: refs/arm-cortex-m3-generic-user-guide.pdf
  - Dashboards:
      - Pinouts: dashboards/pinout.md
      - Clock Calculator: dashboards/clock-dashboard.md
      - Interrupt Explorer: dashboards/interrupt-dashboard.md
      - Low-power Dashboard: dashboards/low-power-dashboard.md


theme:
  name: material
  custom_dir: overrides
  logo: assets/phyxor-icon.svg
  palette:
    primary: black
    accent: amber
  font:
    text: Saira
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_javascript:
  - assets/js/navigation-dropdowns.js
  - assets/js/pinout-model.js
  - assets/js/pinout-dashboard.js
  - assets/js/clock-model.js
  - assets/js/clock-calculator.js
  - assets/js/interrupt-model.js
  - assets/js/interrupt-dashboard.js
  - assets/js/power-model.js
  - assets/js/low-power-dashboard.js

extra_css:
  - assets/css/diagrams.css
  - assets/css/navigation-dropdowns.css
  - assets/css/pinout-dashboard.css
  - assets/css/clock-calculator.css
  - assets/css/interrupt-dashboard.css
  - assets/css/low-power-dashboard.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid

plugins:
  - search
  - mermaid2:
      version: '12.1.0'
      arguments:
        theme: default
        layout: elk
        elk:
          mergeEdges: false
          nodePlacementStrategy: BRANDES_KOEPF
          considerModelOrder: NODES_AND_EDGES
          forceNodeModelOrder: false
          cycleBreakingStrategy: GREEDY_MODEL_ORDER
          keepEntryNodeOnTop: true
