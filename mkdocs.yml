site_name: Blue Pill Bare-Metal
copyright: Copyright &copy; 2026 Phyxor Microsystems
docs_dir: docs

extra:
  generator: true
  homepage: https://www.phyxor.com

nav:
  - Home: index.md
  - Board:
    - Info: board/info.md
    - Pinouts: board/pinout.md
  - System:
      - Memory Map: system/memory-map.md
      - Linker and startup: system/linker-startup.md
      - Reset and interrupts: system/reset-and-interrupts.md
      - Clock Tree: system/clocks.md
      - Clock Calculator: system/clock-dashboard.md
  - Peripherals:
      - GPIO: peripherals/gpio.md
      - ADC: peripherals/adc.md
      - Timers: peripherals/timers.md
      - USART: peripherals/usart.md
      - SysTick: peripherals/systick.md
  - Dev models:
      - C development models: dev-models/abstraction-layers.md
      - Direct-register C: dev-models/direct-registers.md
      - CMSIS: dev-models/cmsis.md
  - Applications:
      - Bare blink: apps/bare-blink.md
  - Environment:
      - Development: environment/development.md
      - Build: environment/build.md
      - Flash, Debug & OpenOCD: environment/flash-debug.md
      - Documentation: environment/documentation.md
  - Reference:
      - Acronyms: reference/acronyms.md
      - STM32F103x8 Datasheet: refs/stm32f103x8-datasheet.pdf
      - STM32F103x8 Reference Manual: refs/stm32f103x8-reference.pdf
      - ARM Cortex-M3 User Guide: refs/arm-cortex-m3-generic-user-guide.pdf

theme:
  name: material
  logo: assets/phyxor-icon.svg
  palette:
    primary: black
    accent: amber
  font:
    text: Saira
    code: JetBrains Mono
  features:
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_javascript:
  - assets/clock-model.js
  - assets/clock-calculator.js

extra_css:
  - assets/clock-calculator.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid

plugins:
  - search
  - mermaid2:
      version: '12.1.0'
      arguments:
        theme: default
        layout: elk
        elk:
          mergeEdges: false
          nodePlacementStrategy: BRANDES_KOEPF
          considerModelOrder: NODES_AND_EDGES
          forceNodeModelOrder: false
          cycleBreakingStrategy: GREEDY_MODEL_ORDER
          keepEntryNodeOnTop: true
