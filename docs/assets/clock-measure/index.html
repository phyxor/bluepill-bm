" data-shade="1" d="M383 187.2L382.7 187.2L382.7 180.3L383 180.2Z"/><path class="iso-shade" data-shade="2" d="M382.7 187.2L382.4 187.2L382.4 180.2L382.7 180.3Z"/><path class="iso-shade" data-shade="3" d="M382.4 187.2L380.1 186.4L380.1 179.4L382.4 180.2ZM380.1 186.4L379.9 186.2L379.9 179.3L380.1 179.4ZM379.9 186.2L379.8 186.1L379.8 179.1L379.9 179.3Z"/><path class="iso-top" d="M384.3 178.2L384.5 178.3L384.6 178.5L384.5 178.7L383.2 180.1L383 180.2L382.7 180.3L382.4 180.2L380.1 179.4L379.9 179.3L379.8 179.1L379.9 178.9L381.2 177.5L381.4 177.4L381.7 177.3L382 177.4Z"/><path class="iso-line iso-crease" data-tone="faint" d="M384.6 178.5L384.5 178.7L383.2 180.1L383 180.2L382.7 180.3L382.4 180.2L380.1 179.4L379.9 179.3L379.8 179.1"/><path class="iso-line iso-bevel" data-tone="faint" d="M384.6 178.5L384.1 178.6L382.9 179.9L382.8 180L382.7 180L382.6 180L380.4 179.2L380.3 179.1L379.8 179.1"/><path class="iso-line iso-edge" data-tone="hi" d="M379.8 179.1L379.9 178.9L381.2 177.5L381.4 177.4L381.7 177.3L382 177.4L384.3 178.2L384.5 178.3L384.6 178.5M384.6 185.5L384.5 185.6L383.2 187.1L383 187.2L382.7 187.2L382.4 187.2L380.1 186.4L379.9 186.2L379.8 186.1M384.6 178.5L384.6 185.5M379.8 179.1L379.8 186.1"/></g><g class="iso-solid" data-lit=""><path class="iso-fill" d="M368.8 190.9L368.9 190.7L370.2 189.3L370.4 189.1L370.7 189.1L371 189.1L373.3 190L373.5 190.1L373.6 190.3L373.6 197.2L373.5 197.4L372.2 198.8L371.9 199L371.7 199L371.4 199L369.1 198.1L368.9 198L368.8 197.8Z"/><path class="iso-shade" data-shade="0" d="M373.6 197.2L373.5 197.4L373.5 190.5L373.6 190.3ZM373.5 197.4L372.2 198.8L372.2 191.9L373.5 190.5ZM372.2 198.8L371.9 199L371.9 192L372.2 191.9Z"/><path class="iso-shade" data-shade="1" d="M371.9 199L371.7 199L371.7 192.1L371.9 192Z"/><path class="iso-shade" data-shade="2" d="M371.7 199L371.4 199L371.4 192L371.7 192.1Z"/><path class="iso-shade" data-shade="3" d="M371.4 199L369.1 198.1L369.1 191.2L371.4 192ZM369.1 198.1L368.9 198L368.9 191.1L369.1 191.2ZM368.9 198L368.8 197.8L3 <footer><span>Two sockets per plate: tick + cycle count</span><span data-readout>33 captures · 32 intervals</span></footer>
<div class="irq-controls"><span class="irq-tag">RTC Second IRQ</span><label class="enable-tag"><input id="enable" type="checkbox">Enable measurement</label><output id="irq-state" aria-live="polite">Disabled</output></div>
<div class="controls">
<button id="play" type="button">Replay capture</button>
<label>HCLK <select id="frequency"><option value="8">8 MHz</option><option value="16">16 MHz</option><option value="32">32 MHz</option><option value="48">48 MHz</option><option value="72" selected>72 MHz</option></select></label>
<label><input id="wrap" type="checkbox" checked>Show 32-bit wrap</label>
</div>
<label class="scrubber" for="sample">Capture position <output id="position">33 / 33</output><input id="sample" type="range" min="0" max="32" value="32" step="1"></label>
<div class="samples">
<div class="sample"><span>First · entry 0</span><code id="first"></code></div>
<div class="sample"><span id="current-label">Selected · entry 32</span><code id="current"></code></div>
<div class="sample"><span>Last · entry 32</span><code id="last"></code></div>
</div>
<div class="result"><code id="difference"></code><br><code id="division"></code><output id="result" aria-live="polite"></output></div>
<p class="hint" id="explanation"></p>
<figcaption>This recorder models the firmware with calibration 64 and an ideal 32768 Hz LSE reference.
Each RTC second interrupt reads DWT->CYCCNT, increments a software tick, and stores the pair.
The highlighted head represents RTC Second IRQ. Enable measurement to arm an empty capture buffer before the next interrupt.
The first capture starts the interval. The next 32 captures complete 32 RTC seconds.
The head shows the selected buffer entry. Animation runs faster than real time.</figcaption>
</figure></main>
<script>
const el = (id) => document.getElementById(id);
const modulus = 2 ** 32;
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
const samples = [...document.querySelectorAll('[data-sample]')];
const head = el('head');
const step = [10.19501571606108,3.623841973509105], zero = [-163.1202514569773,-57.98147157614568];
let selected = -1, eased = 0, enabled = false, playing = false, frame = 0, lastTime = 0, elapsed = 0, visible = false;
let startFraction = Math.random();
const number = (value) => value.toLocaleString('en-US');
function model() {
  const hz = Number(el('frequency').value) * 1e6;
  const span = hz * 32;
  const wrap = el('wrap').checked;
  const minimum = wrap ? modulus - span : 0;
  const range = wrap ? span : modulus - span;
  const start = minimum + Math.floor(startFraction * range);
  const capture = (index) => ({ tick:101 + index, cycles:(start + index * hz) % modulus });
  const first = capture(0), current = capture(selected), end = capture(32);
  const delta = (end.cycles - first.cycles + modulus) % modulus;
  return { hz, first, current, end, delta };
}
function drawHead() {
  head.setAttribute('transform', 'translate(' + (zero[0] + eased * step[0]) + ' ' + (zero[1] + eased * step[1]) + ')');
}
function render() {
  const m = model();
  const text = (s) => 'tick ' + s.tick + '\n' + number(s.cycles) + ' cycles';
  for (const [id, value] of [['first',m.first],['current',m.current]]) el(id).textContent = selected < 0 ? 'Awaiting first IRQ' : text(value);
  el('last').textContent = selected === 32 ? text(m.end) : 'Awaiting entry 32';
  el('position').textContent = (selected + 1) + ' / 33';
  el('current-label').textContent = selected < 0 ? 'No capture yet' : 'Selected · entry ' + selected;
  el('sample').value = Math.max(0,selected);
  el('sample').disabled = selected < 0;
  el('enable').checked = enabled;
  el('irq-state').textContent = enabled ? 'Capture enabled' : selected === 32 ? 'Capture complete' : 'Capture disabled';
  head.toggleAttribute('data-enabled', enabled);
  samples.forEach((sample, index) => sample.toggleAttribute('data-captured', index <= selected));
  document.querySelector('[data-readout]').textContent = (selected + 1) + (selected === 0 ? ' capture · ' : ' captures · ') + Math.max(0,selected) + (selected === 1 ? ' interval' : ' intervals');
  const complete = selected === 32;
  el('difference').textContent = complete ? 'Δcycles = (' + number(m.end.cycles) + ' − ' + number(m.first.cycles) + ') mod 2³² = ' + number(m.delta) : 'Δcycles = last capture − first capture';
  el('division').textContent = complete ? number(m.delta) + ' cycles / 32 RTC seconds' : Math.max(0,selected) + ' / 32 complete RTC intervals';
  el('result').textContent = complete ? number(Math.floor((m.delta + 16) / 32)) + ' Hz measured HCLK' : enabled ? 'Capturing timestamps…' : 'Enable measurement to start';
  el('explanation').textContent = selected < 0 ? enabled ? 'Capture is armed. The next RTC Second IRQ stores the first tick and cycle count.' : 'The amber head is RTC Second IRQ. Enable measurement to clear and arm the capture buffer.' : selected === 0 ? 'The first interrupt stores a baseline. One capture spans zero complete intervals.' : complete ? 'Capture stops. Main code checks all 32 adjacent tick and cycle gaps, then subtracts the endpoints. Unsigned subtraction preserves the elapsed cycles across a wrap.' : 'Each interrupt stores the next pair. DWT keeps counting while the CPU stays awake. The tick is a software sequence number, not the RTC seconds register.';
  el('play').textContent = reduced.matches ? 'Next capture' : playing ? 'Pause capture' : 'Resume capture';
  el('play').disabled = !enabled;
  if (reduced.matches) eased = Math.max(0,selected);
  drawHead();
}
function tick(now) {
  const dt = lastTime ? Math.min((now-lastTime)/1000,.1) : 0;
  lastTime = now;
  if (playing) {
    elapsed += dt;
    selected = Math.min(32,Math.floor(elapsed / .35)-1);
    if (selected === 32) { playing = false; enabled = false; }
    render();
  }
  const target = Math.max(0,selected);
  eased += (target-eased) * (1-Math.exp(-dt/.12));
  if (Math.abs(eased-target) < .001) eased = target;
  drawHead();
  frame = visible && !document.hidden && (playing || eased !== target) ? requestAnimationFrame(tick) : 0;
}
function run() {
  if (!frame && visible && !document.hidden && !reduced.matches) { lastTime = 0; frame = requestAnimationFrame(tick); }
}
el('enable').addEventListener('change', () => {
  enabled = el('enable').checked;
  playing = enabled && !reduced.matches;
  if (enabled) { startFraction=Math.random(); selected=-1; eased=0; elapsed=0; }
  render(); run();
});
el('sample').addEventListener('input', () => { playing = false; selected = Number(el('sample').value); render(); run(); });
el('play').addEventListener('click', () => {
  if (!enabled) return;
  if (reduced.matches) { selected=Math.min(32,selected+1); if (selected===32) enabled=false; render(); return; }
  if (playing) playing = false;
  else { elapsed = (selected+1) * .35; playing = true; }
  render(); run();
});
for (const id of ['frequency','wrap']) el(id).addEventListener('change', render);
el('theme').addEventListener('click', () => {
  const dark = document.body.dataset.theme !== 'dark';
  document.body.dataset.theme = dark ? 'dark' : 'light';
  el('theme').setAttribute('aria-label', 'Switch to ' + (dark ? 'light' : 'dark') + ' theme');
});
new IntersectionObserver(([entry]) => {
  visible = entry.isIntersecting;
  if (visible) run();
  else { cancelAnimationFrame(frame); frame = 0; }
}).observe(document.querySelector('main'));
document.addEventListener('visibilitychange', () => { if (document.hidden) { cancelAnimationFrame(frame); frame=0; } else run(); });
reduced.addEventListener('change', () => { if (reduced.matches) { playing=false; cancelAnimationFrame(frame); frame=0; render(); } else run(); });
render();
</script></body></html>
